# ============================================================================
# Secomm Production AI Toolkit — Capability Registry
# ============================================================================
# The single source of truth for every invokable capability the toolkit
# advertises. Generated documentation (CHEATSHEET, COMMAND_REFERENCE,
# supported-commands) is a RENDER of this file — never an independent list.
#
# Status contract (the rule this registry enforces):
#   Anything with tools.{tool}.enabled: true MUST have an existing adapter at
#   tools.{tool}.adapter. `bin/project-ai-validate` checks this and fails on
#   any mismatch. Capabilities intentionally without an adapter on a tool use
#   invocation_type: nl-only (natural language) and are advertised honestly.
#
# Supported tools: claude, codex, copilot. Cursor is NOT supported.
#
# invocation_type values:
#   skill           = real registered adapter the tool discovers (Claude skill / generated file)
#   prompt-snippet  = a prompt file the user pastes (Codex/Copilot convention)
#   nl-only         = works via natural language only (no executable adapter)
#   function        = backed by a function recipe (no direct invokable surface)
#   gate            = an approval/workflow gate, NOT a command (must not be advertised as one)
#   none            = not available on this tool
# ============================================================================

schema_version: 1
project_toolkit_version: "4.x"
generated_from: "audit/capability-implementation-matrix.md"

# --------------------------------------------------------------------------
# Phase 1 capabilities (B4) — single source of truth for the phase1_capabilities
# block emitted into .ai/toolkit/toolkit-version.md. Mirrored verbatim by the
# toolkit-version-template. Flip a flag to false only if a mechanism is reverted.
# --------------------------------------------------------------------------
phase1_capabilities:
  canonical_records: true              # 1a — .ai/records/{features,bugs,releases,decisions}/
  per_work_item_mode: true             # 1b — mode per work item (RM-04/RM-05)
  project_memory: true                 # 1c — .ai/project/{CURRENT_STATE,COMPONENT_INDEX}.md
  runtime_separation: true             # 1d — .ai/runtime/ + .ai/.gitignore carve-out (RM-02)
  quota_optimization: true             # 1e — context-loading + quota (RM-05)
  governance_deduplication: true       # 1f — one canonical source per governance concept

