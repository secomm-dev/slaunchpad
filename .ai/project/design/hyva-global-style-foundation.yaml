  version_applied: none

production_contract:
  path: unresolved              # theme-owned contract — created at first foundation run
  schema_version: unresolved

generated_output:
  path: unresolved              # future design-tokens.css (distinct from generated/hyva-tokens.css)
  manifest: unresolved

approved_modes:                 # requires approved design decision (evidence: none exists)
  color: unresolved             # NOTE hyva.config.json currently defines --color-primary/secondary
  brand: unresolved             # from a single inline token set — no Figma mode model exists
  font: unresolved

typography:
  breakpoint_token: unresolved  # design decision; no responsive token scale exists yet
  note: no custom font/typography rules in the child theme — inherits Hyva/default

validation_pages: unresolved    # no representative-page decision recorded

figma:
  file_id: unresolved
  foundations_node: unresolved
  master_components_nodes: unresolved

audit_rule_overrides: []        # none — no project-specific audit rules yet (contract-level concern once tokens exist)
