# Contract reproducing the originating project's token layout.
# Serves as the Test A regression contract (byte-identity vs the pre-refactor
# transformer's baseline CSS) and as a realistic worked example.
schema_version: 1

input:
  file_suffix: .tokens.json
  mode_resolution: figma-then-filename

collections:
  color:       { path: colors, mode_source: filename }
  brand:       { path: theme, mode_source: filename }
  font:        { path: font, mode_source: filename }
  component:   { path: buttons, mode_source: filename }  # audit-only role (not emitted)
  typography:  { path: typography, modes: { base: mobile, responsive: desktop } }
  sizes:       { file: sizes.tokens.json }
  effects:     { file: effects.tokens.json }

generation:
  approved_modes: { color: light, brand: default, font: default }
  typography:
    property_keys: [family, size, line-height, letter-spacing, weight-base, weight-strong]
    unitless_key_pattern: '^(weight-base|weight-strong)$'
  breakpoint:
    token: breakpoint/desktop_sm
    fallback: 1280px
  preserve_alias_collections: [brand]

exclude:
  paths: [other/**]

audit:
  rules:
    - { kind: suspicious_zero, collection: component, path_prefix: cta/ }

output:
  namespaces: { source: ds, typography: ds-type, effect: ds-effect }
  theme_map:
    spacing_prefix: spacing/
    radius_prefix: radius/
    breakpoint_prefix: breakpoint/
    radius_defaults: { xs: 2px, sm: 4px, md: 6px, lg: 8px, xl: 12px, 2xl: 16px, 3xl: 24px, 4xl: 32px, full: 9999px }
  shadow:
    root_prefix: shadow/
    color_path_prefix: effects/shadows/
    default_color: 'rgb(0 0 0 / 0.1)'
